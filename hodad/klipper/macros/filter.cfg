# Filter (Nevermore-style) fan automation for hodad, modelled on voronica's
# macros/filter.cfg. The fan itself is [fan_generic filter_fan] in
# bigtreetech-skr-pico-v1.0.cfg.
#
# PRINT_START calls _FILTER_AUTO with the bed target: at or above
# variable_bed_threshold (ABS/ASA and other enclosed, high-temp plastics) the
# filter runs from the start of heating, scrubbing fumes and circulating air
# so the chamber warms evenly; below it the filter is switched off.
# _FINALIZE_PRINT (print end and cancel) schedules it off after
# variable_off_delay seconds, so the chamber is cleared before it stops; a
# print that starts in the meantime keeps it running.

[gcode_macro _FILTER_AUTO]
description: Helper: filter fan on for high-temp prints, off otherwise
variable_bed_threshold: 90
variable_speed: 1.0
gcode:
    {% set bed = params.BED|default(0)|float %}
    {% if bed >= bed_threshold %}
        UPDATE_DELAYED_GCODE ID=_DELAY_FILTER_OFF DURATION=0
        SET_FAN_SPEED FAN=filter_fan SPEED={speed}
        RESPOND MSG="Filter fan on (bed target {bed|int} C)"
    {% else %}
        SET_FAN_SPEED FAN=filter_fan SPEED=0
    {% endif %}

[gcode_macro _FILTER_OFF_LATER]
description: Helper: switch the filter fan off after the post-print delay
variable_off_delay: 300
gcode:
    {% if printer['fan_generic filter_fan'].speed|float > 0 %}
        UPDATE_DELAYED_GCODE ID=_DELAY_FILTER_OFF DURATION={off_delay}
        RESPOND MSG="Filter fan off in {(off_delay / 60)|int} min"
    {% endif %}

[delayed_gcode _DELAY_FILTER_OFF]
gcode:
    {% if printer.print_stats.state|lower not in ["printing", "paused"] %}
        SET_FAN_SPEED FAN=filter_fan SPEED=0
        RESPOND MSG="Filter fan off"
    {% endif %}

[gcode_macro FILTER]
description: Toggle the filter fan
gcode:
    {% if printer['fan_generic filter_fan'].speed|float > 0 %}
        UPDATE_DELAYED_GCODE ID=_DELAY_FILTER_OFF DURATION=0
        SET_FAN_SPEED FAN=filter_fan SPEED=0
        RESPOND MSG="Filter fan off"
    {% else %}
        SET_FAN_SPEED FAN=filter_fan SPEED=1
        RESPOND MSG="Filter fan on"
    {% endif %}
