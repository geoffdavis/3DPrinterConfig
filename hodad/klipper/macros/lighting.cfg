#####################################################################
# Status lighting: a state loop instead of per-macro LED calls
#####################################################################
#
# Effects are in lighting/led_effects.cfg. Once a second _LED_STATE works
# out what the printer is doing from print_stats, idle_timeout and the
# heaters, and switches the display and toolhead effects when that
# changes. Lights are therefore right however the printer got there:
# Mainsail, the display menu, a runout pause, a slicer that skips
# PRINT_START, a restart.
#
# The loop only runs BETWEEN gcode commands, so a long macro (PRINT_START
# waiting on M190, a G28) shows nothing new until it returns. Such macros
# set their phase directly with _LED_SET (or the led_* wrappers below);
# the loop takes over again when they finish.
#
# Display LED (one SET_LED per change; see lighting/led_effects.cfg for
# why it is not an led_effect):
#
#   ready      dim blue                   idle, recently used
#   sleep      faint steady blue          idle_timeout reached, or 30 min
#                                         of ready after a restart
#   heating    amber                      a heater below its target
#   busy       purple                     homing, probing, loading, ...
#   printing   green                      printing, heaters at target
#   paused     amber flash                paused (incl. filament runout)
#   complete   green, slow flash          print done, until idle_timeout
#   cancelled  red, 10 s                  then ready
#   error      red flash                    print_stats error
#
# Toolhead: white work light in heating/busy/printing/paused; otherwise a
# slow red pulse while the nozzle is above 50 C. Bed LED: its own
# temperature, always.

[gcode_macro _LED_STATE]
description: Set status lighting from the printer's state (runs every second)
variable_state: ""
variable_ticks: 0
variable_cancel_done: False
# The display LED garbles every update (random colours even at one SET_LED
# per second, and with GRBW; no neopixel errors in klippy.log), which
# points at the data signal, not the config: 2026-11-20. Off until the
# wiring is sorted; True puts the display back in the scheme.
variable_use_display: False
gcode:
    {% set ps = printer.print_stats.state %}
    {% set idle = printer.idle_timeout.state %}
    {% set e = printer.extruder %}
    {% set b = printer.heater_bed %}
    {% set heating = (e.target > 0 and e.temperature < e.target - 3)
                     or (b.target > 0 and b.temperature < b.target - 2) %}
    {% set cdone = cancel_done %}
    {% if ps != "cancelled" %}
        {% set cdone = False %}
    {% elif state == "cancelled" and ticks >= 10 %}
        {% set cdone = True %}
    {% endif %}
    {% if ps == "paused" %}
        {% set new = "paused" %}
    {% elif ps == "printing" %}
        {% set new = "heating" if heating else "printing" %}
    {% elif heating %}
        {% set new = "heating" %}
    {% elif ps == "cancelled" and not cdone %}
        {% set new = "cancelled" %}
    {% elif ps == "error" and idle != "Idle" %}
        {% set new = "error" %}
    {% elif ps == "complete" and idle != "Idle" %}
        {% set new = "complete" %}
    {% elif idle == "Idle" and state != "" and (state != "ready" or ticks >= 1800) %}
        # idle_timeout starts out "Idle" after a restart, so a fresh boot
        # gets 30 min of ready (counted in ticks) before it sleeps.
        {% set new = "sleep" %}
    {% else %}
        {% set new = "ready" %}
    {% endif %}
    {% if cdone != cancel_done %}
        SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=cancel_done VALUE={cdone}
    {% endif %}
    {% if new != state %}
        _LED_SET STATE={new}
    {% elif state in ["cancelled", "ready", "paused", "complete", "error"] %}
        SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=ticks VALUE={ticks + 1}
        {% if state in ["paused", "complete", "error"] %}
            # Flash at 0.5 Hz: one SET_LED per second, which the display
            # takes fine.
            _LED_DISP STATE={state} ON={(ticks + 1) % 2 == 0}
        {% endif %}
    {% endif %}

[gcode_macro _LED_SET]
description: Show a lighting state now (STATE=ready|sleep|heating|busy|printing|paused|complete|cancelled|error)
gcode:
    {% set s = params.STATE|default("ready")|lower %}
    _LED_DISP STATE={s}
    {% if s in ["heating", "busy", "printing", "paused"] %}
        SET_LED_EFFECT EFFECT=toolhead_hot STOP=1
        SET_LED_EFFECT EFFECT=toolhead_work
    {% else %}
        SET_LED_EFFECT EFFECT=toolhead_work STOP=1
        SET_LED_EFFECT EFFECT=toolhead_hot
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=state VALUE='"{s}"'
    SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=ticks VALUE=0

[gcode_macro _LED_DISP]
description: Set the display LED for a lighting state (ON=False for the dark half of a flash)
gcode:
    {% set s = params.STATE|lower %}
    {% set on = params.ON|default("True") == "True" %}
    {% set enabled = printer["gcode_macro _LED_STATE"].use_display %}
    {% set lit = {"ready": [0.0, 0.0, 0.15], "sleep": [0.0, 0.0, 0.03],
                  "heating": [0.5, 0.2, 0.0], "busy": [0.35, 0.0, 0.45],
                  "printing": [0.0, 0.45, 0.0], "paused": [0.6, 0.25, 0.0],
                  "complete": [0.0, 0.45, 0.0], "cancelled": [0.6, 0.0, 0.0],
                  "error": [0.8, 0.0, 0.0]} %}
    {% set dark = {"paused": [0.0, 0.0, 0.0], "complete": [0.0, 0.05, 0.0],
                   "error": [0.0, 0.0, 0.0]} %}
    {% if s not in lit %}
        { action_raise_error("_LED_DISP: unknown STATE=%s" % s) }
    {% endif %}
    {% set c = lit[s] if on or s not in dark else dark[s] %}
    {% if enabled %}
    # SYNC=0: don't queue behind the toolhead. A synced SET_LED advances
    # toolhead.print_time, which idle_timeout (heaters/motors off after
    # 30 min) and _CASELIGHT_IDLE both read as activity -- the 1 s flash
    # would keep the heaters on forever.
    SET_LED LED=displayStatus RED={c[0]} GREEN={c[1]} BLUE={c[2]} SYNC=0
    {% endif %}

[delayed_gcode _led_state_timer]
initial_duration: 2
gcode:
    _LED_STATE
    UPDATE_DELAYED_GCODE ID=_led_state_timer DURATION=1

#####################################################################
# Old names, kept for PRINT_START, the display menu and muscle memory
#####################################################################

[gcode_macro led_busy]
gcode:
    _LED_SET STATE=busy

[gcode_macro led_calibrating_z]
gcode:
    _LED_SET STATE=busy

[gcode_macro led_cleaning]
gcode:
    _LED_SET STATE=busy

[gcode_macro led_homing]
gcode:
    _LED_SET STATE=busy

[gcode_macro led_input_shaper]
gcode:
    _LED_SET STATE=busy

[gcode_macro led_leveling]
gcode:
    _LED_SET STATE=busy

[gcode_macro led_loading]
gcode:
    _LED_SET STATE=busy

[gcode_macro led_meshing]
gcode:
    _LED_SET STATE=busy

[gcode_macro led_unloading]
gcode:
    _LED_SET STATE=busy

[gcode_macro led_heating]
gcode:
    _LED_SET STATE=heating

[gcode_macro led_toolhead_heating]
gcode:
    _LED_SET STATE=heating

[gcode_macro led_printing]
gcode:
    _LED_SET STATE=printing

[gcode_macro led_filament_runout]
gcode:
    _LED_SET STATE=paused

# Let the loop pick the state on its next pass.
[gcode_macro led_standby]
gcode:
    SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=state VALUE='""'

[gcode_macro led_off]
gcode:
    _LED_SET STATE=sleep

[gcode_macro led_blinkenlights]
gcode:
    SET_LED_EFFECT EFFECT=critical_error

# Bed and toolhead only (the display cannot animate), until stopped with
# SET_LED_EFFECT EFFECT=party_time STOP=1.
[gcode_macro led_party_time]
gcode:
    SET_LED_EFFECT EFFECT=party_time

#####################################################################
# Case light (plain PWM output, not a neopixel)
#####################################################################

[gcode_macro led_case_off]
gcode:
    SET_PIN PIN=caselight VALUE=0.00

# Caselight idle timeout: off after 20 minutes with no activity.
# "Activity" = a print running or paused, anything queued on the toolhead (moves,
# homing, heater changes all advance toolhead.print_time), or the light
# being switched back on. Polled once a minute; idle_timeout itself stays
# at 30 min for heaters/motors, so this needs its own clock.
[gcode_macro _CASELIGHT_IDLE]
variable_timeout_minutes: 20
variable_idle_minutes: 0
variable_last_print_time: 0.0
variable_last_value: 0.0
gcode:
    {% set pt = printer.toolhead.print_time %}
    {% set val = printer["output_pin caselight"].value %}
    {% set active = printer.idle_timeout.state == "Printing"
                    or printer.print_stats.state in ["printing", "paused"]
                    or pt != last_print_time
                    or (val > 0 and last_value == 0) %}
    {% set mins = 0 if active else idle_minutes + 1 %}
    SET_GCODE_VARIABLE MACRO=_CASELIGHT_IDLE VARIABLE=last_print_time VALUE={pt}
    SET_GCODE_VARIABLE MACRO=_CASELIGHT_IDLE VARIABLE=last_value VALUE={val}
    SET_GCODE_VARIABLE MACRO=_CASELIGHT_IDLE VARIABLE=idle_minutes VALUE={mins}
    {% if val > 0 and mins >= timeout_minutes %}
        { action_respond_info("Caselight off after %d min idle" % timeout_minutes) }
        led_case_off
    {% endif %}

[delayed_gcode _caselight_idle_timer]
initial_duration: 60
gcode:
    _CASELIGHT_IDLE
    UPDATE_DELAYED_GCODE ID=_caselight_idle_timer DURATION=60
