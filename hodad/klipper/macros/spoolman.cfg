# Spoolman: set or clear the active spool from G-code.
#
# Moonraker's [spoolman] section (set by the NixOS host,
# my.klipperPrinter.spoolman) reports filament use against the active
# spool. These are Moonraker's documented macros:
# https://moonraker.readthedocs.io/en/stable/configuration/#setting-the-active-spool-from-klipper
#
# The PipSpool OrcaSlicer plugin writes `SET_ACTIVE_SPOOL ID=<n>` into each
# spool's filament start G-code, so a print selects its own spool. Picking
# a spool in Mainsail's Spoolman panel does the same thing by hand.

[gcode_macro SET_ACTIVE_SPOOL]
description: Make Spoolman spool ID the active spool
gcode:
  {% if params.ID %}
    {% set id = params.ID|int %}
    {action_call_remote_method("spoolman_set_active_spool", spool_id=id)}
  {% else %}
    {action_respond_info("Parameter 'ID' is required")}
  {% endif %}

[gcode_macro CLEAR_ACTIVE_SPOOL]
description: Clear the active Spoolman spool
gcode:
  {action_call_remote_method("spoolman_set_active_spool", spool_id=None)}
